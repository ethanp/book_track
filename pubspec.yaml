name: book_track
description: "Book tracker"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  ethan_utils:
    path: ../ethan_utils
  ethan_ui:
    path: ../ethan_ui
  ethan_sync:
    path: ../ethan_sync
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.0
  flutter_riverpod: ^3.4.2
  freezed_annotation: ^3.1.0
  http: ^1.2.2
  intl: ^0.20.1
  json_annotation: ^4.12.0
  riverpod_annotation: ^4.0.6
  shared_preferences: ^2.5.4
  uuid: ^4.5.1
  powersync: ^1.16.2
  path: ^1.9.0
  path_provider: ^2.1.4
  sqlite3_flutter_libs: ^0.5.41

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.8
  build_runner: ^2.16.0
  riverpod_lint: ^3.1.8
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  flutter_launcher_icons: ^0.14.1

dependency_overrides:
  sqlite3_flutter_libs: 0.5.41
  powersync: 1.16.2
  path_provider_foundation: 2.5.1

flutter_launcher_icons:
  android: false
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/unknown_book_cover.jpg
